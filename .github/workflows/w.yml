name: w

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions: {}

jobs:
  publish:
    name: Publish
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: 'ubuntu-24.04'

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Marker
        run: echo "HARNESS_MARKER wf=w.yml event=${{ github.event_name }} ref=${{ github.ref }}"
      - name: Claims
        run: |
          set -euo pipefail
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 --decode | jq '{repository, workflow_ref, ref, event_name, environment}'
