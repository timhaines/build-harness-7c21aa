name: w-tagpol

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  newname:
    runs-on: 'ubuntu-24.04'
    environment: tagpol-x
    permissions: { contents: read, id-token: write }
    steps:
      - name: Claims
        run: |
          set -euo pipefail
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 --decode | jq -c '{ref, environment}'
  spaced:
    runs-on: 'ubuntu-24.04'
    environment: "tagpol "
    permissions: { contents: read, id-token: write }
    steps:
      - name: Claims
        run: |
          set -euo pipefail
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 --decode | jq -c '{ref, environment}'
